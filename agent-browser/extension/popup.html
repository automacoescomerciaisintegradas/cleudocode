<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleudocode Browser Relay</title>
    <style>
        body {
            width: 320px;
            min-height: 400px;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e2e8f0;
        }
        
        .header {
            background: linear-gradient(135deg, #FF5F5F 0%, #FF4B2B 100%);
            padding: 16px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: white;
        }
        
        .header p {
            margin: 4px 0 0 0;
            font-size: 11px;
            opacity: 0.9;
            color: white;
        }
        
        .content {
            padding: 16px;
        }
        
        .status-card {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .status-row:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }
        
        .status-value {
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-connected {
            color: #10b981;
        }
        
        .status-disconnected {
            color: #ef4444;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        
        .dot-green {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }
        
        .dot-red {
            background: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }
        
        .btn-primary {
            background: #FF5F5F;
            color: white;
        }
        
        .btn-primary:hover {
            background: #FF4B2B;
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .config-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .config-label {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 500;
        }
        
        .config-input {
            width: 100%;
            padding: 8px;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 12px;
            box-sizing: border-box;
        }
        
        .config-input:focus {
            outline: none;
            border-color: #FF5F5F;
        }
        
        .footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }
        
        .footer-text {
            font-size: 10px;
            color: #64748b;
            margin: 0;
        }
        
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #FF5F5F;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Cleudocode Relay</h1>
        <p>Browser Automation Gateway</p>
    </div>
    
    <div class="content">
        <div class="status-card">
            <div class="status-row">
                <span class="status-label">Gateway</span>
                <span id="gateway-status" class="status-value status-disconnected">
                    <span class="status-dot dot-red"></span>Desconectado
                </span>
            </div>
            <div class="status-row">
                <span class="status-label">Aba Atual</span>
                <span id="tab-status" class="status-value status-disconnected">
                    <span class="status-dot dot-red"></span>Desconectada
                </span>
            </div>
            <div class="status-row">
                <span class="status-label">Porta Relay</span>
                <span id="relay-port" class="status-value">18902</span>
            </div>
        </div>
        
        <button id="btn-toggle" class="btn btn-primary" disabled>
            <span class="loading"></span> Verificando...
        </button>
        
        <button id="btn-refresh" class="btn btn-secondary">
            Atualizar Status
        </button>
        
        <div class="config-section">
            <div class="config-label">Porta do Relay Server</div>
            <input type="number" id="relay-port-input" class="config-input" value="18902" min="1024" max="65535">
        </div>
    </div>
    
    <div class="footer">
        <p class="footer-text">Cleudocode v1.0.0 - Automações Comerciais Integradas</p>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
