<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:800px; height:800px; font-family:Arial,Helvetica,sans-serif; background:#2a0845; }
  .card { width:800px; height:800px; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#6441a5 0%,#2a0845 60%,#1a0b2e 100%); }

  .top { position:absolute; top:0; left:0; right:0; height:96px; padding:24px 30px; display:flex; align-items:center; background:rgba(0,0,0,.15); }
  .logoaci { height:58px; width:auto; object-fit:contain; filter:drop-shadow(0 3px 8px rgba(0,0,0,.4)); }
  .badge { margin-left:auto; background:#ff007f; color:#fff; font-weight:800; font-size:24px; padding:8px 16px; border-radius:16px; box-shadow:0 6px 16px rgba(255,0,127,.5); transform:rotate(-3deg); }

  .fotobg { position:absolute; left:70px; right:70px; top:108px; height:384px; background:#fff; border-radius:26px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 14px 34px rgba(0,0,0,.4); }
  .prodimg { max-width:94%; max-height:94%; object-fit:contain; border-radius:12px; }

  .tags { position:absolute; left:36px; right:36px; top:500px; color:#fff; font-weight:900; font-size:30px; line-height:1.15;
    text-align:center; text-shadow:0 4px 10px rgba(0,0,0,.4);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .precobg { position:absolute; left:30px; right:30px; bottom:78px; display:flex; align-items:center; justify-content:center; gap:22px; }
  .price { color:#ffe24d; font-weight:900; font-size:56px; text-shadow:0 5px 12px rgba(0,0,0,.4); }
  .cta { background:linear-gradient(90deg,#ff007f,#ff5ca8); color:#fff; font-weight:900; font-size:24px; padding:14px 22px;
    border-radius:18px; box-shadow:0 8px 22px rgba(255,0,127,.45); white-space:nowrap; }

  .linkbar { position:absolute; left:0; right:0; bottom:0; height:70px; background:rgba(0,0,0,.72);
    display:flex; align-items:center; justify-content:center; padding:0 30px; }
  .linktxt { color:#fff; text-align:center; }
  .linktxt .lbl { font-weight:800; font-size:16px; margin-right:8px; }
  .linktxt .url { font-size:22px; font-weight:800; color:#ffe24d; word-break:break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><img class="logoaci" src="{{LOGO_ACI}}" alt="Achadinhos ACI"/><div class="badge">-50%</div></div>

    <div class="fotobg">
      <img class="prodimg" src="{{PRODUTO_IMG}}" alt="Produto"/>
    </div>

    <div class="tags">🛍️ {{PRODUTO}}</div>
    <div class="precobg">
      <div class="price">{{PRECO}}</div>
      <div class="cta">💜 Aproveite o mega desconto! 👆</div>
    </div>

    <div class="linkbar">
      <div class="linktxt"><span class="lbl">📲 Desconto garantido 👉</span><span class="url">{{LINK}}</span></div>
    </div>
  </div>
</body>
</html>
