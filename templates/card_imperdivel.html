<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:800px; height:800px; font-family:Arial,Helvetica,sans-serif; background:#fff; }
  .card { width:800px; height:800px; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#22c55e 0%,#6fc52e 40%,#eab308 100%); }

  /* faixa do topo (logo + badge) */
  .top { position:absolute; top:0; left:0; right:0; height:96px; padding:22px 30px; display:flex; align-items:center; background:rgba(0,0,0,.12); }
  .logoaci { height:56px; width:auto; object-fit:contain; filter:drop-shadow(0 3px 8px rgba(0,0,0,.35)); }
  .badge { margin-left:auto; background:#d91f11; color:#fff; font-weight:800; font-size:17px; padding:9px 16px; border-radius:20px; }

  /* foto do produto em destaque discreto, bem centralizada, sem nada por cima */
  .fotobg { position:absolute; left:70px; right:70px; top:108px; height:384px; background:#fff; border-radius:26px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 14px 34px rgba(0,0,0,.35); }
  .prodimg { max-width:94%; max-height:94%; object-fit:contain; border-radius:12px; }

  /* nome do produto (máx. 2 linhas) na área livre abaixo da foto */
  .tags { position:absolute; left:36px; right:36px; top:500px; color:#fff; font-weight:900; font-size:30px; line-height:1.15;
    text-align:center; text-shadow:0 4px 10px rgba(0,0,0,.4);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* textos de preço e CTA, na faixa própria acima do rodapé (não toca a foto) */
  .precobg { position:absolute; left:40px; right:40px; bottom:78px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .pricel { color:#fff; }
  .old { color:rgba(255,255,255,.9); font-size:22px; text-decoration:line-through; }
  .price { color:#fff; font-weight:900; font-size:56px; text-shadow:0 5px 12px rgba(0,0,0,.35); }
  .cta { background:#fff; color:#d91f11; font-weight:900; font-size:22px; padding:13px 20px; border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,.3); text-align:center; white-space:nowrap; }

  /* barra do link na base, separada, sem tocar a foto */
  .linkbar { position:absolute; left:0; right:0; bottom:0; height:70px; background:rgba(0,0,0,.72);
    display:flex; align-items:center; justify-content:center; padding:0 30px; }
  .linktxt { color:#fff; text-align:center; }
  .linktxt .lbl { font-weight:800; font-size:16px; margin-right:8px; }
  .linktxt .url { font-size:22px; font-weight:800; color:#ffe24d; word-break:break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><img class="logoaci" src="{{LOGO_ACI}}" alt="Achadinhos ACI"/><div class="badge">🔥 OFERTA IMPERDÍVEL!</div></div>

    <div class="fotobg">
      <img class="prodimg" src="{{PRODUTO_IMG}}" alt="Produto"/>
    </div>

    <div class="tags">{{PRODUTO}}</div>
    <div class="precobg">
      <div class="pricel">
        <div class="old">de {{PRECO_ANTES}}</div>
        <div class="price">{{PRECO}}</div>
      </div>
      <div class="cta">✨ Clique e garanta já! 👆</div>
    </div>

    <div class="linkbar">
      <div class="linktxt"><span class="lbl">📲 Aproveite o desconto 👉</span><span class="url">{{LINK}}</span></div>
    </div>
  </div>
</body>
</html>
