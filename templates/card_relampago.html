<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:800px; height:800px; font-family:Arial,Helvetica,sans-serif; background:#111; }
  .card { width:800px; height:800px; position:relative; overflow:hidden;
    background:radial-gradient(circle at 20% 10%,#ff3b30 -10%,#c8102e 45%,#7a0020 100%); }

  .zig { position:absolute; top:0; left:0; right:0; height:104px; background:#ffd600; clip-path:polygon(0 0,100% 0,100% 58%,0 100%); }
  .zig .t { position:absolute; top:24px; left:30px; color:#111; font-weight:900; font-size:42px; letter-spacing:1px; }
  .logoaci { position:absolute; right:28px; top:14px; height:58px; width:auto; object-fit:contain; filter:drop-shadow(0 3px 8px rgba(0,0,0,.3)); }

  .fotobg { position:absolute; left:70px; right:70px; top:112px; height:380px; background:#fff; border-radius:26px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 14px 34px rgba(0,0,0,.45); }
  .prodimg { max-width:94%; max-height:94%; object-fit:contain; border-radius:12px; }

  .tags { position:absolute; left:36px; right:36px; top:500px; color:#fff; font-weight:900; font-size:30px; line-height:1.15;
    text-align:center; text-shadow:0 4px 10px rgba(0,0,0,.45);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .precobg { position:absolute; left:30px; right:30px; bottom:78px; display:flex; align-items:center; justify-content:center; gap:22px; }
  .price { color:#ffd600; font-weight:900; font-size:56px; text-shadow:0 5px 12px rgba(0,0,0,.45); }
  .cta { background:#ffd600; color:#111; font-weight:900; font-size:24px; padding:14px 22px; border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,.4); white-space:nowrap; }

  .linkbar { position:absolute; left:0; right:0; bottom:0; height:70px; background:rgba(0,0,0,.72);
    display:flex; align-items:center; justify-content:center; padding:0 30px; }
  .linktxt { color:#fff; text-align:center; }
  .linktxt .lbl { font-weight:800; font-size:16px; margin-right:8px; }
  .linktxt .url { font-size:22px; font-weight:800; color:#ffe24d; word-break:break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="zig"><div class="t">⚡ OFERTA RELÂMPAGO!</div><img class="logoaci" src="{{LOGO_ACI}}" alt="Achadinhos ACI"/></div>

    <div class="fotobg">
      <img class="prodimg" src="{{PRODUTO_IMG}}" alt="Produto"/>
    </div>

    <div class="tags">{{PRODUTO}}</div>
    <div class="precobg">
      <div class="price">{{PRECO}}</div>
      <div class="cta">🎯 Clique e garanta já! 👆</div>
    </div>

    <div class="linkbar">
      <div class="linktxt"><span class="lbl">📲 Corra, é por tempo limitado 👉</span><span class="url">{{LINK}}</span></div>
    </div>
  </div>
</body>
</html>
