<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:800px; height:800px; font-family:'Segoe UI',Arial,Helvetica,sans-serif; background:#0b1a2e; }
  .card { width:800px; height:800px; position:relative; overflow:hidden;
    background:linear-gradient(150deg,#0f2a43 0%,#123b5a 50%,#0a1c30 100%); }

  .top { position:absolute; top:0; left:0; right:0; height:96px; padding:24px 34px; display:flex; align-items:center; border-bottom:1px solid rgba(255,255,255,.15); }
  .logoaci { height:56px; width:auto; object-fit:contain; filter:drop-shadow(0 3px 8px rgba(0,0,0,.4)); }
  .badge { margin-left:auto; border:2px solid #7dd3fc; color:#7dd3fc; font-weight:800; font-size:15px; padding:7px 14px; border-radius:20px; letter-spacing:1px; }

  .fotobg { position:absolute; left:70px; right:70px; top:108px; height:384px; background:#fff; border-radius:26px;
    display:flex; align-items:center; justify-content:center; box-shadow:0 14px 34px rgba(0,0,0,.4); }
  .prodimg { max-width:94%; max-height:94%; object-fit:contain; border-radius:12px; }

  .tags { position:absolute; left:36px; right:36px; top:500px; color:#fff; font-weight:800; font-size:30px; line-height:1.15;
    text-align:center; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .precobg { position:absolute; left:30px; right:30px; bottom:78px; display:flex; align-items:center; justify-content:center; gap:22px; }
  .old { color:#94a3b8; font-size:22px; text-decoration:line-through; text-align:center; }
  .price { color:#7dd3fc; font-weight:900; font-size:56px; text-shadow:0 5px 14px rgba(0,0,0,.4); }
  .cta { background:linear-gradient(90deg,#0284c7,#38bdf8); color:#fff; font-weight:800; font-size:24px; padding:14px 22px;
    border-radius:14px; box-shadow:0 8px 20px rgba(56,189,248,.35); white-space:nowrap; }

  .linkbar { position:absolute; left:0; right:0; bottom:0; height:70px; background:rgba(0,0,0,.68);
    display:flex; align-items:center; justify-content:center; }
  .linktxt { color:#fff; text-align:center; }
  .linktxt .lbl { font-weight:800; font-size:16px; margin-right:8px; }
  .linktxt .url { font-size:22px; font-weight:800; color:#7dd3fc; word-break:break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><img class="logoaci" src="{{LOGO_ACI}}" alt="Achadinhos ACI"/><div class="badge">OFERTA CONFIRMADA</div></div>

    <div class="fotobg">
      <img class="prodimg" src="{{PRODUTO_IMG}}" alt="Produto"/>
    </div>

    <div class="tags">✨ {{PRODUTO}}</div>
    <div class="precobg">
      <div class="pricel">
        <div class="old">de {{PRECO_ANTES}}</div>
        <div class="price">{{PRECO}}</div>
      </div>
      <div class="cta">✅ Garantir essa oferta</div>
    </div>

    <div class="linkbar">
      <div class="linktxt"><span class="lbl">📲 Acesse o produto agora 👉</span><span class="url">{{LINK}}</span></div>
    </div>
  </div>
</body>
</html>
