version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: cleudocode-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=your-email@example.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    networks:
      - cleudocode-network

  ollama:
    image: ollama/ollama:latest
    container_name: cleudocode-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - cleudocode-network

  telegram-bot:
    image: ${CLEUDOCODE_IMAGE:-cleudocode-local}
    build: .
    container_name: cleudocode-telegram-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-ollama}
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    networks:
      - cleudocode-network

  cleudocode-gateway:
    image: ${CLEUDOCODE_IMAGE:-cleudocode-local}
    build: .
    container_name: cleudocode-gateway
    restart: unless-stopped
    environment:
      - CLEUDOCODE_GATEWAY_PORT=18900
      - CLEUDOCODE_GATEWAY_TOKEN=${CLEUDOCODE_GATEWAY_TOKEN}
      - DEFAULT_PROVIDER=${DEFAULT_PROVIDER:-ollama}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_FALLBACK_SEQUENCE=${LLM_FALLBACK_SEQUENCE:-ollama}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:1.5b}
    volumes:
      - .:/app
      - /root/.cleudocode:/root/.cleudocode
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cleudocode-gateway.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.cleudocode-gateway.entrypoints=websecure"
      - "traefik.http.routers.cleudocode-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.cleudocode-gateway.loadbalancer.server.port=18900"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - ollama
    networks:
      - cleudocode-network

  cleudocode-browser-relay:
    image: ${CLEUDOCODE_IMAGE:-cleudocode-local}
    container_name: cleudocode-browser-relay
    restart: unless-stopped
    command: ["python3", "-m", "http.server", "18902", "--bind", "0.0.0.0"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cleudocode-browser-relay.rule=Host(`your-domain.com`) && Path(`/relay`)"
      - "traefik.http.routers.cleudocode-browser-relay.entrypoints=websecure"
      - "traefik.http.routers.cleudocode-browser-relay.tls.certresolver=letsencrypt"
      - "traefik.http.services.cleudocode-browser-relay.loadbalancer.server.port=18902"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18902/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cleudocode-network

  cleudocode-webhook-receiver:
    image: ${CLEUDOCODE_IMAGE:-cleudocode-local}
    container_name: cleudocode-webhook-receiver
    restart: unless-stopped
    command: ["python3", "webhook_receiver_5001.py"]
    environment:
      - CLEUDOCODE_GATEWAY_URL=http://cleudocode-gateway:18900
      - WEBHOOK_PORT=5001
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cleudocode-webhook.rule=Host(`your-domain.com`) && Path(`/webhook`)"
      - "traefik.http.routers.cleudocode-webhook.entrypoints=websecure"
      - "traefik.http.routers.cleudocode-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.services.cleudocode-webhook.loadbalancer.server.port=5001"
    volumes:
      - .:/app
    networks:
      - cleudocode-network

  cleudocode-cli:
    image: ${CLEUDOCODE_IMAGE:-cleudocode-local}
    container_name: cleudocode-cli
    restart: unless-stopped
    profiles: ["cli"]
    network_mode: host
    volumes:
      - .:/app
      - /root/.cleudocode:/root/.cleudocode
    entrypoint: ["/bin/bash"]
    command: ["-c", "sleep infinity"]
    networks:
      - cleudocode-network

volumes:
  traefik-letsencrypt:
  ollama-data:

networks:
  cleudocode-network:
    driver: bridge
