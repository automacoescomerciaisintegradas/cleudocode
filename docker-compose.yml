# ============================================
# CLEUDO CODE - Docker Compose
# LLM P2P Chat System
# ============================================

services:
  # Gateway principal - CLEUDO CODE
  cleudocode-gateway:
    image: ${CLEUDOCODE_IMAGE:-cleudocode-local}
    build: .
    container_name: cleudocode-gateway
    restart: unless-stopped
    ports:
      - "${CLEUDOCODE_GATEWAY_PORT:-18900}:8501"
    environment:
      # Configurações do Gateway
      - CLEUDOCODE_CONFIG_DIR=${CLEUDOCODE_CONFIG_DIR:-/root/.cleudocode}
      - CLEUDOCODE_WORKSPACE_DIR=${CLEUDOCODE_WORKSPACE_DIR:-/root/.cleudocode/workspace}
      - CLEUDOCODE_GATEWAY_TOKEN=${CLEUDOCODE_GATEWAY_TOKEN}
      - CLEUDOCODE_GATEWAY_BIND=${CLEUDOCODE_GATEWAY_BIND:-127.0.0.1}
      # Configurações do navegador (Browser Relay)
      - CLEUDOCODE_BROWSER_RELAY_PORT=${CLEUDOCODE_BROWSER_RELAY_PORT:-18902}
      - CLEUDOCODE_BROWSER_CONTROL=true
      # Configurações do Streamlit
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      # Persistência de dados
      - ${CLEUDOCODE_CONFIG_DIR:-/root/.cleudocode}:/home/node/.cleudocode
      - ${CLEUDOCODE_WORKSPACE_DIR:-/root/.cleudocode/workspace}:/home/node/.cleudocode/workspace
      - ./exports:/app/exports
      - ./uploads:/app/uploads
      - ./memory_db:/app/memory_db
      - ./agents:/app/agents
      - ./docs:/app/docs
      - ./agent-browser:/app/agent-browser
    networks:
      - cleudocode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Browser Relay - Serviço para comunicação com extensão do navegador
  cleudocode-browser-relay:
    image: ${CLEUDOCODE_IMAGE:-cleudocode-local}
    container_name: cleudocode-browser-relay
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLEUDOCODE_BROWSER_RELAY_PORT:-18902}:${CLEUDOCODE_BROWSER_RELAY_PORT:-18902}"
    environment:
      - CLEUDOCODE_CONFIG_DIR=${CLEUDOCODE_CONFIG_DIR:-/root/.cleudocode}
      - CLEUDOCODE_WORKSPACE_DIR=${CLEUDOCODE_WORKSPACE_DIR:-/root/.cleudocode/workspace}
      - CLEUDOCODE_BROWSER_RELAY_PORT=${CLEUDOCODE_BROWSER_RELAY_PORT:-18902}
      - CLEUDOCODE_BROWSER_CONTROL=true
    volumes:
      - ${CLEUDOCODE_CONFIG_DIR:-/root/.cleudocode}:/home/node/.cleudocode
      - ${CLEUDOCODE_WORKSPACE_DIR:-/root/.cleudocode/workspace}:/home/node/.cleudocode/workspace
      - ./agent-browser:/app/agent-browser
    networks:
      - cleudocode-network
    command: ["python3", "-m", "http.server", "${CLEUDOCODE_BROWSER_RELAY_PORT:-18902}", "--bind", "0.0.0.0"]

  # CLI para comandos administrativos
  cleudocode-cli:
    image: ${CLEUDOCODE_IMAGE:-cleudocode-local}
    container_name: cleudocode-cli
    profiles: ["cli"]
    environment:
      - CLEUDOCODE_CONFIG_DIR=${CLEUDOCODE_CONFIG_DIR:-/root/.cleudocode}
      - CLEUDOCODE_WORKSPACE_DIR=${CLEUDOCODE_WORKSPACE_DIR:-/root/.cleudocode/workspace}
      - CLEUDOCODE_GATEWAY_TOKEN=${CLEUDOCODE_GATEWAY_TOKEN}
    volumes:
      - ${CLEUDOCODE_CONFIG_DIR:-/root/.cleudocode}:/home/node/.cleudocode
      - ${CLEUDOCODE_WORKSPACE_DIR:-/root/.cleudocode/workspace}:/home/node/.cleudocode/workspace
      - ./agent-browser:/app/agent-browser
    networks:
      - cleudocode-network
    entrypoint: ["/bin/bash"]
    command: ["-c", "sleep infinity"]

networks:
  cleudocode-network:
    driver: bridge