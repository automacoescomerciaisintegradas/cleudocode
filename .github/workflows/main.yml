name: CleudoCode CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Teste e Empacotamento
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Static smoke checks
        run: |
          python -m py_compile \
            cli/main.py \
            cli/message_command.py \
            core/config_manager.py \
            skills/loader.py
          bash -n install_vps.sh

      - name: CLI smoke tests
        run: |
          python cli/main.py config --help
          python cli/main.py skills

      - name: Build source distribution
        run: |
          python setup.py sdist

