<!DOCTYPE html>
<html lang="pt-BR">
<!-- Discovery Tool Integrated into Cleudocode Ecosystem -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery - Telegram & WhatsApp Channels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a; /* Dark mode background matched with existing app */
            color: #e2e8f0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            text-align: center;
        }

        .header h1 {
            color: #38bdf8;
            margin-bottom: 15px;
            font-size: 2.5rem;
            letter-spacing: -0.025em;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            text-align: center;
            border: 1px solid #334155;
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #38bdf8;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: #38bdf8;
        }

        .stat-label {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        .card h2 {
            color: #38bdf8;
            margin-bottom: 20px;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
        }

        .card h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 20px;
            background: #38bdf8;
            margin-right: 12px;
            border-radius: 2px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            background: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #475569;
            border-color: #64748b;
        }

        .btn-success {
            background: #059669;
            border-color: #065f46;
        }

        .btn-success:hover {
            background: #10b981;
        }

        .btn-danger {
            background: #dc2626;
            border-color: #991b1b;
        }

        .btn-danger:hover {
            background: #ef4444;
        }

        .search-box input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .list-container {
            max-height: 700px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Custom Scrollbar */
        .list-container::-webkit-scrollbar {
            width: 8px;
        }
        .list-container::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .list-container::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .item {
            padding: 20px;
            background: #0f172a;
            border-radius: 10px;
            margin-bottom: 12px;
            border-left: 5px solid #38bdf8;
            transition: transform 0.1s;
        }

        .item:hover {
            transform: scale(1.01);
        }

        .item.channel { border-left-color: #10b981; }
        .item.group { border-left-color: #f59e0b; }
        .item.chat { border-left-color: #3b82f6; }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .item-name {
            font-weight: 700;
            color: #f8fafc;
            font-size: 1.1rem;
        }

        .item-type {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .type-channel { background: #065f46; color: #d1fae5; }
        .type-group { background: #92400e; color: #fef3c7; }
        .type-chat { background: #1e40af; color: #dbeafe; }

        .item-id {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 13px;
            color: #94a3b8;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 6px;
            word-break: break-all;
        }

        .highlight {
            color: #38bdf8;
            font-weight: bold;
        }

        .item-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .item-actions button {
            padding: 8px 14px;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            padding: 60px;
        }

        .spinner {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #475569;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 25px;
            opacity: 0.3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div style="font-size: 50px; margin-bottom: 10px;">🌌</div>
            <h1>CleudoDiscovery</h1>
            <p>Identificador Universal de Canais, Grupos e Peers para Cleudocode Ecosystem</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="stat-total">0</div>
                <div class="stat-label">Total Peers</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-channels">0</div>
                <div class="stat-label">Canais / Newsletter</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-groups">0</div>
                <div class="stat-label">Grupos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-chats">0</div>
                <div class="stat-label">Privados</div>
            </div>
        </div>

        <div class="card">
            <h2>⚡ Hub de Operações</h2>
            <div class="actions">
                <button onclick="buscarTodos()" class="btn-success">🔍 Iniciar Escaneamento Completo</button>
                <button onclick="buscarPorID()">🎯 Filtrar por Peer ID</button>
                <button onclick="limparLista()" class="btn-danger">🗑️ Resetar Sessão</button>
                <button onclick="window.location.href='/'">🏠 Retornar ao Chat</button>
            </div>
        </div>

        <div class="card">
            <h2>🔎 Filtro Inteligente</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Refinar por nome, ID ou metadados de número..."
                    onkeyup="filtrarLista()">
            </div>
        </div>

        <div class="card">
            <h2>📋 Resultados do Radar</h2>
            <div id="chats-list" class="list-container">
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z">
                        </path>
                    </svg>
                    <p>Radar inativo. Inicie o escaneamento para detectar peers nas redes conectadas.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allChats = [];

        async function buscarTodos() {
            const listDiv = document.getElementById('chats-list');
            listDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Sincronizando com a API do Cleudocode...</p></div>';

            try {
                // Unificando com a porta principal do sistema
                const response = await fetch('/api/evolution/chats');
                const json = await response.json();

                if (!json.success) {
                    throw new Error(json.error || 'Falha na resposta da API');
                }

                allChats = json.data || [];
                processarChats(allChats);

            } catch (error) {
                console.error('Erro de Scanner:', error);
                listDiv.innerHTML = `
                    <div class="empty-state">
                        <p style="color: #ef4444; font-weight: bold;">❌ Falha na Sincronização</p>
                        <p style="margin-top: 10px; font-size: 14px;">${error.message}</p>
                    </div>
                `;
            }
        }

        function processarChats(chats) {
            const listDiv = document.getElementById('chats-list');

            if (chats.length === 0) {
                listDiv.innerHTML = '<div class="empty-state"><p>Nenhum peer detectado nas instâncias ativas.</p></div>';
                return;
            }

            const channels = chats.filter(c => c.id && (c.id.includes('@newsletter') || c.id.includes('@channel')));
            const groups = chats.filter(c => c.id && c.id.includes('@g.us'));
            const privateChats = chats.filter(c => c.id && (c.id.includes('@s.whatsapp.net') || c.id.includes('@lid')));

            document.getElementById('stat-total').textContent = chats.length;
            document.getElementById('stat-channels').textContent = channels.length;
            document.getElementById('stat-groups').textContent = groups.length;
            document.getElementById('stat-chats').textContent = privateChats.length;

            let html = '';
            if (channels.length > 0) {
                html += '<h3 style="margin: 30px 0 15px; color: #10b981; border-bottom: 2px solid #065f46; padding-bottom: 5px;">📢 Canais & Transmissão</h3>';
                channels.forEach(chat => html += renderChatItem(chat, 'channel'));
            }
            if (groups.length > 0) {
                html += '<h3 style="margin: 30px 0 15px; color: #f59e0b; border-bottom: 2px solid #92400e; padding-bottom: 5px;">👥 Grupos e Comunidades</h3>';
                groups.forEach(chat => html += renderChatItem(chat, 'group'));
            }
            if (privateChats.length > 0) {
                html += '<h3 style="margin: 30px 0 15px; color: #3b82f6; border-bottom: 2px solid #1e40af; padding-bottom: 5px;">💬 Chats Diretos</h3>';
                privateChats.forEach(chat => html += renderChatItem(chat, 'chat'));
            }
            listDiv.innerHTML = html;
        }

        function renderChatItem(chat, type) {
            const name = chat.name || chat.subject || chat.verifyName || chat.notify || 'Peer Desconhecido';
            const id = chat.id || 'N/A';
            const number = id.split('@')[0];

            const typeLabels = {
                'channel': { label: 'Canal', class: 'type-channel' },
                'group': { label: 'Grupo', class: 'type-group' },
                'chat': { label: 'Privado', class: 'type-chat' }
            };

            const typeInfo = typeLabels[type];

            return `
                <div class="item ${type}" data-name="${name.toLowerCase()}" data-id="${id.toLowerCase()}" data-number="${number}">
                    <div class="item-header">
                        <div class="item-name">${name}</div>
                        <span class="item-type ${typeInfo.class}">${typeInfo.label}</span>
                    </div>
                    <div class="item-id">
                        <strong>UID:</strong> ${id}<br>
                        <strong>Origin:</strong> ${number.match(/^\d+$/) ? `<span class="highlight">${number}</span>` : number}
                    </div>
                    <div class="item-actions">
                        <button onclick="copiarID('${id}')">📋 Copy ID</button>
                        <button onclick="copiarNumero('${number}')">📋 Copy Peer</button>
                        <button onclick="dispatchCmd('${id}')" class="btn-success">🚀 Disparar /zap</button>
                    </div>
                </div>
            `;
        }

        function dispatchCmd(id) {
            const msg = prompt("Digite a mensagem para disparo via Ponte Telegram-WhatsApp:");
            if (msg) {
                alert(`🚀 Comando emulado: /zap ${id.split('@')[0]} ${msg}\n\nO Cleudobot processará o roteamento em background.`);
            }
        }

        function filtrarLista() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const items = document.querySelectorAll('.item');
            items.forEach(item => {
                const searchData = item.getAttribute('data-name') + ' ' + item.getAttribute('data-id') + ' ' + item.getAttribute('data-number');
                item.style.display = searchData.includes(searchTerm) ? 'block' : 'none';
            });
        }

        function copiarID(id) {
            navigator.clipboard.writeText(id).then(() => alert('ID copiado!'));
        }

        function copiarNumero(number) {
            navigator.clipboard.writeText(number).then(() => alert('Peer ID copiado!'));
        }

        function limparLista() {
            if (confirm('Deseja resetar a visualização do radar?')) {
                allChats = [];
                location.reload();
            }
        }
    </script>
</body>
</html>
